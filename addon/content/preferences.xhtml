<vbox id="zoteroia-prefs-root" onload="window.ZIAPrefs &amp;&amp; window.ZIAPrefs.init()">
	<!-- Os textos vêm de i18n.js (atributos data-zia e data-zia-label), em PT-PT ou inglês -->
	<groupbox>
		<label><html:h2 data-zia="app.name"/></label>
		<html:div class="zia-prefs-row">
			<label data-zia-label="prefs.uiLang"/>
			<html:select id="zia-ui-lang"/>
		</html:div>
		<html:div class="zia-prefs-note" data-zia="prefs.intro"/>
		<html:div class="zia-prefs-sub" data-zia="prefs.status"/>
		<html:div id="zia-status-anthropic" class="zia-prefs-status"/>
		<html:div id="zia-status-claude" class="zia-prefs-status"/>
		<html:div id="zia-status-openai" class="zia-prefs-status"/>
		<html:div id="zia-status-codex" class="zia-prefs-status"/>
		<html:div id="zia-status-gemini" class="zia-prefs-status"/>
		<html:div class="zia-prefs-row">
			<label data-zia-label="prefs.defaultEngine"/>
			<html:select id="zia-default-engine"/>
		</html:div>
		<html:div class="zia-prefs-note" data-zia="prefs.defaultEngine.note"/>
	</groupbox>

	<groupbox>
		<label><html:h2 data-zia="prefs.anthropic.title"/></label>
		<html:div class="zia-prefs-note" data-zia="prefs.anthropic.note"/>
		<html:div class="zia-prefs-row">
			<label data-zia-label="prefs.apiKey"/>
			<html:input type="password" id="zia-anthropic-key" placeholder="sk-ant-..." autocomplete="off" spellcheck="false"/>
			<button id="zia-anthropic-save" data-zia-label="prefs.saveKey"/>
			<button id="zia-anthropic-clear" data-zia-label="prefs.delete"/>
			<button id="zia-anthropic-test" data-zia-label="prefs.test"/>
		</html:div>
		<html:div id="zia-anthropic-keystate" class="zia-prefs-note"/>
		<html:div id="zia-anthropic-result" class="zia-prefs-result"/>
		<html:div class="zia-prefs-row">
			<label data-zia-label="prefs.model"/>
			<html:select id="zia-anthropic-model"/>
		</html:div>
		<html:div class="zia-prefs-row">
			<label data-zia-label="prefs.maxChars"/>
			<html:input type="number" min="20000" step="10000" id="zia-pref-anthropic-max" preference="extensions.zoteroia.anthropic.maxChars" style="min-width: 120px;"/>
		</html:div>
	</groupbox>

	<groupbox>
		<label><html:h2 data-zia="prefs.claude.title"/></label>
		<html:div class="zia-prefs-note" data-zia="prefs.claude.note"/>
		<html:div class="zia-prefs-row">
			<label data-zia-label="prefs.model"/>
			<html:input type="text" id="zia-pref-claude-model" preference="extensions.zoteroia.claude.model" style="min-width: 160px;"/>
			<html:span class="zia-prefs-note" data-zia="prefs.claude.models"/>
		</html:div>
		<html:div class="zia-prefs-row">
			<label data-zia-label="prefs.path"/>
			<html:input type="text" id="zia-pref-claude-path" preference="extensions.zoteroia.claude.path"/>
			<button id="zia-claude-detect" data-zia-label="prefs.detect"/>
		</html:div>
		<checkbox id="zia-pref-ignorekey" preference="extensions.zoteroia.claude.ignoreApiKey" data-zia-label="prefs.ignoreKey"/>
		<html:div class="zia-prefs-row">
			<label data-zia-label="prefs.maxChars"/>
			<html:input type="number" min="20000" step="10000" id="zia-pref-claude-max" preference="extensions.zoteroia.claude.maxChars" style="min-width: 120px;"/>
		</html:div>
		<html:div class="zia-prefs-row">
			<button id="zia-claude-test" data-zia-label="prefs.testEnable"/>
		</html:div>
		<html:div id="zia-claude-result" class="zia-prefs-result"/>
	</groupbox>

	<groupbox>
		<label><html:h2 data-zia="prefs.codex.title"/></label>
		<html:div class="zia-prefs-note" data-zia="prefs.codex.note"/>
		<html:div class="zia-prefs-row">
			<label data-zia-label="prefs.model"/>
			<html:input type="text" id="zia-pref-codex-model" preference="extensions.zoteroia.codex.model" style="min-width: 160px;"/>
			<html:span class="zia-prefs-note" data-zia="prefs.codex.models"/>
		</html:div>
		<html:div class="zia-prefs-row">
			<label data-zia-label="prefs.path"/>
			<html:input type="text" id="zia-pref-codex-path" preference="extensions.zoteroia.codex.path"/>
			<button id="zia-codex-detect" data-zia-label="prefs.detect"/>
		</html:div>
		<html:div class="zia-prefs-row">
			<label data-zia-label="prefs.maxChars"/>
			<html:input type="number" min="20000" step="10000" id="zia-pref-codex-max" preference="extensions.zoteroia.codex.maxChars" style="min-width: 120px;"/>
		</html:div>
		<html:div class="zia-prefs-row">
			<button id="zia-codex-test" data-zia-label="prefs.testEnable"/>
		</html:div>
		<html:div id="zia-codex-result" class="zia-prefs-result"/>
	</groupbox>

	<groupbox>
		<label><html:h2 data-zia="prefs.openai.title"/></label>
		<html:div class="zia-prefs-note" data-zia="prefs.openai.note"/>
		<html:div class="zia-prefs-row">
			<label data-zia-label="prefs.apiKey"/>
			<html:input type="password" id="zia-openai-key" placeholder="sk-..." autocomplete="off" spellcheck="false"/>
			<button id="zia-openai-save" data-zia-label="prefs.saveKey"/>
			<button id="zia-openai-clear" data-zia-label="prefs.delete"/>
			<button id="zia-openai-test" data-zia-label="prefs.test"/>
		</html:div>
		<html:div id="zia-openai-keystate" class="zia-prefs-note"/>
		<html:div id="zia-openai-result" class="zia-prefs-result"/>
		<html:div class="zia-prefs-row">
			<label data-zia-label="prefs.model"/>
			<html:select id="zia-openai-model"/>
		</html:div>
		<html:div class="zia-prefs-row">
			<label data-zia-label="prefs.maxChars"/>
			<html:input type="number" min="20000" step="10000" id="zia-pref-openai-max" preference="extensions.zoteroia.openai.maxChars" style="min-width: 120px;"/>
		</html:div>
	</groupbox>

	<groupbox>
		<label><html:h2 data-zia="prefs.gemini.title"/></label>
		<html:div class="zia-prefs-note" data-zia="prefs.gemini.note"/>
		<html:div class="zia-prefs-row">
			<label data-zia-label="prefs.apiKey"/>
			<html:input type="password" id="zia-gemini-key" placeholder="AIza..." autocomplete="off" spellcheck="false"/>
			<button id="zia-gemini-save" data-zia-label="prefs.saveKey"/>
			<button id="zia-gemini-clear" data-zia-label="prefs.delete"/>
		</html:div>
		<html:div id="zia-gemini-keystate" class="zia-prefs-note"/>
		<html:div class="zia-prefs-row">
			<label data-zia-label="prefs.model"/>
			<html:input type="text" id="zia-pref-gemini-model" preference="extensions.zoteroia.gemini.model" style="min-width: 220px;"/>
			<button id="zia-gemini-list" data-zia-label="prefs.gemini.list"/>
		</html:div>
		<html:div id="zia-gemini-result" class="zia-prefs-result"/>
		<html:div class="zia-prefs-row">
			<label data-zia-label="prefs.maxChars"/>
			<html:input type="number" min="20000" step="10000" id="zia-pref-gemini-max" preference="extensions.zoteroia.gemini.maxChars" style="min-width: 120px;"/>
		</html:div>
	</groupbox>

	<groupbox>
		<label><html:h2 data-zia="prefs.answers.title"/></label>
		<html:div class="zia-prefs-row">
			<label data-zia-label="prefs.answerLang"/>
			<html:select id="zia-answer-lang"/>
		</html:div>
		<checkbox id="zia-pref-annotations" preference="extensions.zoteroia.context.annotations" data-zia-label="prefs.annotations"/>
		<checkbox id="zia-pref-fichas" preference="extensions.zoteroia.fichas.autoSave" data-zia-label="prefs.fichasAuto"/>
	</groupbox>

	<groupbox>
		<label><html:h2 data-zia="prefs.prompts.title"/></label>
		<html:div class="zia-prefs-note" data-zia="prefs.prompts.note"/>
		<html:textarea id="zia-custom-prompts" class="zia-prefs-textarea" spellcheck="false"/>
		<html:div id="zia-custom-state" class="zia-prefs-note"/>
	</groupbox>

	<groupbox>
		<label><html:h2 data-zia="prefs.security.title"/></label>
		<html:div class="zia-prefs-note" data-zia="prefs.security.note"/>
		<html:div class="zia-prefs-row">
			<button id="zia-clear-all" data-zia-label="prefs.clearAll"/>
			<button id="zia-reset-privacy" data-zia-label="prefs.resetPrivacy"/>
		</html:div>
		<html:div id="zia-security-result" class="zia-prefs-result"/>
	</groupbox>
</vbox>
